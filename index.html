<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="学习工作台">
<meta name="theme-color" content="#4f46e5">
<title>学习工作台</title>
<style>
:root{
  --p:#4f46e5; --p2:#6366f1; --pl:#eef2ff;
  --bg:#f4f5fb; --card:#ffffff; --tx:#1f2333; --tx2:#6b7280; --line:#e8eaf3;
  --ok:#10b981; --okl:#ecfdf5; --warn:#f59e0b; --warnl:#fffbeb; --bad:#ef4444; --badl:#fef2f2;
  --red-pen:#dc2626;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px;max-width:720px;margin:0 auto}
a{color:var(--p);text-decoration:none}
/* header */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:14px 16px 12px;border-radius:0 0 18px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(79,70,229,.25)}
header .ht h1{font-size:18px;font-weight:700}
header .ht .sub{font-size:12px;opacity:.85;margin-top:2px}
header .gear{background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer}
.streak{background:rgba(255,255,255,.15);border-radius:10px;padding:4px 10px;font-size:12px;font-weight:600}
/* layout */
main{padding:14px 14px 8px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(31,35,51,.06)}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--pl);color:var(--p)}
.sec-title{font-size:14px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.muted{color:var(--tx2);font-size:13px}
.small{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;margin:2px 3px 2px 0;background:var(--pl);color:var(--p);cursor:pointer;border:1px solid transparent}
.pill.on{background:var(--p);color:#fff}
.btn{display:inline-block;border:none;background:var(--p);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:12px;cursor:pointer}
.btn.ghost{background:var(--pl);color:var(--p)}
.btn.ok{background:var(--ok)}
.btn.gray{background:#e5e7eb;color:#374151}
.btn.danger{background:var(--badl);color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn:active{transform:scale(.97)}
input[type=text],input[type=number],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-family:inherit;background:#fbfbfe;color:var(--tx);outline:none}
input:focus,textarea:focus{border-color:var(--p2)}
textarea{min-height:84px;resize:vertical;line-height:1.6}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin:12px 0 5px}
/* gate */
.gate{background:linear-gradient(150deg,#fff7ed,#ffedd5);border:2px dashed #f59e0b;border-radius:var(--radius);padding:18px;margin-bottom:14px}
.gate h2{font-size:17px;color:#b45309;margin-bottom:6px}
.lockbar{background:var(--warnl);border:1px solid #fde68a;color:#92400e;font-size:13px;padding:9px 12px;border-radius:12px;margin-bottom:12px;display:flex;gap:8px;align-items:center}
/* task rows */
.task{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none}
.cb{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #c7cbdd;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px;background:#fff}
.cb.on{background:var(--ok);border-color:var(--ok)}
.task .tx{flex:1;min-width:0}
.task .tx b{font-size:14.5px}
.task .tx .d{font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.55}
.task.done .tx b{text-decoration:line-through;color:var(--tx2)}
/* module card */
.mod{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(31,35,51,.06)}
.mod .mh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mod .mh .ic{width:42px;height:42px;border-radius:12px;background:var(--pl);display:flex;align-items:center;justify-content:center;font-size:22px}
.mod .mh .nm{flex:1}
.mod .mh .nm b{font-size:15.5px}
.mod .mh .nm .sub{font-size:12px;color:var(--tx2);margin-top:2px}
.bar{height:8px;background:#ecedf5;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:99px;transition:width .4s}
.bar i.g{background:linear-gradient(90deg,#34d399,#10b981)}
/* quiz */
.quiz{background:var(--pl);border-radius:12px;padding:13px;margin-top:10px}
.quiz .q{font-weight:600;font-size:14px;margin-bottom:9px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;margin-bottom:7px;cursor:pointer;font-family:inherit}
.opt.right{background:var(--okl);border-color:var(--ok);color:#065f46;font-weight:600}
.opt.wrong{background:var(--badl);border-color:var(--bad);color:#991b1b}
.expl{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.5}
/* code */
pre{background:#1e1b3a;color:#e2e8f0;border-radius:12px;padding:12px 14px;font-size:12.5px;overflow-x:auto;font-family:Consolas,Menlo,monospace;line-height:1.6;margin:8px 0}
code.inline{background:var(--pl);color:var(--p);padding:1px 6px;border-radius:6px;font-size:12.5px;font-family:Consolas,monospace}
/* books */
.book{display:flex;gap:12px;padding:13px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.book:last-child{border-bottom:none}
.cover{flex:none;width:46px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:700}
.book .bi{flex:1;min-width:0}
.book .bi b{font-size:14.5px}
.book .bi .sub{font-size:12px;color:var(--tx2);margin:2px 0 5px}
.book .bi .desc{font-size:12.5px;color:#4b5563;line-height:1.5}
.links{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px}
.lk{font-size:11.5px;padding:4px 10px;border-radius:8px;background:var(--pl);color:var(--p);border:none;cursor:pointer;font-weight:600}
a.lk{display:inline-block}
/* feedback card */
.fb{border:2px solid var(--red-pen);border-radius:var(--radius);padding:16px;background:#fffdf9;position:relative}
.fb .stamp{position:absolute;top:-12px;right:14px;background:var(--red-pen);color:#fff;font-size:13px;font-weight:800;padding:4px 12px;border-radius:8px;transform:rotate(3deg)}
.fb .score{font-size:30px;font-weight:800;color:var(--red-pen)}
.dim{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dotted #f3d4d4}
.dim b{color:var(--red-pen)}
.pen{font-family:"Kaiti SC","KaiTi",cursive;color:var(--red-pen)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav button{border:none;background:none;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#9ca3af;cursor:pointer;padding:4px 0;font-family:inherit;position:relative}
nav button .ni{font-size:21px;line-height:1.2}
nav button.on{color:var(--p);font-weight:700}
nav .dot{position:absolute;top:2px;right:calc(50% - 16px);width:9px;height:9px;border-radius:99px;background:var(--bad)}
/* misc */
.row{display:flex;gap:10px}
.row>*{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.note{font-size:12.5px;color:var(--tx2);background:var(--pl);border-radius:10px;padding:9px 12px;line-height:1.6;margin-top:10px}
.empty{text-align:center;color:#9ca3af;font-size:13px;padding:22px 0}
.hist{border-left:3px solid var(--p2);padding:10px 14px;background:#fff;border-radius:0 12px 12px 0;margin-bottom:10px;font-size:13px}
.hist .h{display:flex;justify-content:space-between;color:var(--tx2);font-size:12px;margin-bottom:5px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:var(--pl)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1f2333;color:#fff;padding:10px 20px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
.tip{background:linear-gradient(135deg,#eef2ff,#fdf4ff);border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.7;margin-bottom:14px;border:1px solid #e0e7ff}
.big-emoji{font-size:26px}
@media(min-width:600px){nav{border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<header>
  <div class="ht">
    <h1>📚 学习工作台</h1>
    <div class="sub" id="hsub"></div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="streak" id="hstreak"></div>
    <button class="gear" onclick="App.go('settings')">⚙</button>
  </div>
</header>
<main id="view"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
/* ============ 工具 ============ */
const $=s=>document.querySelector(s);
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fmt(d)};
const todayStr=()=>fmt(new Date());
const cnDate=s=>{const d=pd(s);return (d.getMonth()+1)+'月'+d.getDate()+'日'};
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function daysBetween(a,b){return Math.round((pd(b)-pd(a))/86400000)}

/* ============ 数据内容 ============ */
/* 音标 48 个 */
const IPA=[["iː","长音“衣”，嘴角咧开拉长","sheep / see / meet"],["ɪ","短促的“衣”，肌肉放松","sit / big / ship"],["e","短“诶”，嘴巴半开","bed / pen / red"],["æ","大口“哎”，下巴拉低","cat / apple / bad"],["ɑː","长“啊”，口腔打开","car / art / far"],["ɒ","短“奥”，嘴唇圆圆的","hot / dog / box"],["ɔː","长“哦”，嘴唇拢圆","door / ball / war"],["ʊ","短“乌”，快而轻","book / put / good"],["uː","长“乌”，嘴唇撮圆","food / blue / two"],["ʌ","短“阿”，不张太大嘴","bus / cup / sun"],["ɜː","长“额”，舌身平放","bird / girl / turn"],["ə","最轻的“额”，永远不重读","about / teacher"],["eɪ","“诶”滑向“衣”","name / day / late"],["aɪ","“啊”滑向“衣”","time / like / my"],["ɔɪ","“哦”滑向“衣”","boy / voice / toy"],["əʊ","“额”滑向“乌”","go / home / nose"],["aʊ","“啊”滑向“乌”","now / house / how"],["ɪə","“衣”滑向“额”","here / near / dear"],["eə","“哎”滑向“额”","hair / there / bear"],["ʊə","“乌”滑向“额”","tour / sure"],["p","双唇闭紧再爆开，送气","pen / happy"],["b","同p但不送气，嗓子振动","book / job"],["t","舌尖抵上齿龈弹开","tea / water"],["d","同t但嗓子振动","day / bad"],["k","舌根抵软腭弹开","key / school"],["g","同k但嗓子振动","go / big"],["f","上齿轻咬下唇吹气","five / life"],["v","同f但嗓子振动","very / love"],["θ","舌尖轻伸上下齿之间吹气","think / three"],["ð","同θ但嗓子振动","this / that"],["s","气流从齿缝挤出“丝”","see / yes"],["z","同s但嗓子振动","zoo / zero"],["ʃ","“诗”的声母，嘴唇前突","she / wash"],["ʒ","像“日”但更轻润","usually / vision"],["tʃ","“吃”的声母","chair / teach"],["dʒ","像“缴”，嗓子振动","job / age"],["tr","“戳”连读，先t后r","tree / try"],["dr","“捉”连读，先d后r","dream / drink"],["ts","“次”连读","cats / seats"],["dz","“子”连读","beds / words"],["m","双唇闭住发“姆”","man / name"],["n","舌尖抵上齿龈发“恩”","no / pen"],["ŋ","后鼻音“嗯”，嘴微张","sing / long"],["h","哈气，像冬天暖手","he / hello"],["l","舌尖抵上齿龈，气从两边走","leg / tell"],["r","舌尖卷起不碰任何地方","red / run"],["j","快速轻读的“也”","yes / you"],["w","快速轻读的“乌”，嘴唇撮圆","we / word"]];

/* 自然拼读 16 条规则 */
const PHONICS=[["短元音 a","闭音节中 a 发 /æ/","cat, map, bag, hand, apple"],["短元音 e","闭音节中 e 发 /e/","bed, pen, ten, red, egg"],["短元音 i","闭音节中 i 发 /ɪ/","sit, big, pig, fish, milk"],["短元音 o","闭音节中 o 发 /ɒ/","hot, dog, box, top, stop"],["短元音 u","闭音节中 u 发 /ʌ/","bus, cup, sun, run, duck"],["魔法 e（a_e）","词尾 e 不发音，让 a 读自己名字 /eɪ/","cake, name, game, late, table→table"],["魔法 e（i_e）","i 读 /aɪ/，结尾 e 不发音","bike, five, time, like, rice"],["魔法 e（o_e）","o 读 /əʊ/","home, nose, note, those, close"],["魔法 e（u_e）","u 读 /juː/ 或 /uː/","cute, use, tube, music"],["字母组合 sh","一起发 /ʃ/（“诗”）","ship, fish, she, shop, wash"],["字母组合 ch","一起发 /tʃ/（“吃”）","chair, lunch, teach, much"],["字母组合 th","清音/θ/（think）与浊音/ð/（this）","three, this, that, mother"],["字母组合 ck","只发一个 /k/","duck, clock, black, pick"],["字母组合 ee / ea","发长音 /iː/","tree, see, read, eat, teacher"],["字母组合 oo","两种：短/ʊ/（book）与长/uː/（food）","book, look, food, moon"],["r 控制的元音","ar=/ɑː/，or=/ɔː/，er=/ə/","car, star, horse, sister, teacher"],
["辅音组合 bl/cl/fl","b+ l 连读，快速滑过去不停顿","black, blue, class, clock, fly, flower, sleep"],
["辅音组合 br/cr/dr/fr","先做好 b/c/d/f 的口型，再快速卷到 r","bread, brother, cry, cross, drink, friend, fruit"],
["辅音组合 st/sp/sk/sw","s 后面的清辅音要读得像浊音（不送气）","star, stop, sky, school, swim, sweet, snow"],
["组合 ai/ay","一起发 /eɪ/（字母A的名字）","rain, train, wait, day, play, say, today"],
["组合 oa/ow","发 /əʊ/（字母O的名字）","boat, coat, road, snow, window, yellow, know"],
["组合 ee/ea/ie","发长音 /iː/","green, sleep, sea, tea, eat, read, piece"],
["词尾的 y","单音节词尾 y 发 /aɪ/，多音节词尾 y 发 /ɪ/","my, sky, fly, why, city, happy, baby, sorry"],
["多音节拆读","先找元音切音节，从后往前一小块一小块拼","bas-ket-ball, to-mor-row, break-fast, ba-na-na"]];

/* 辨音强化 4 天（音标阶段收尾） */
const CONTRAST=[["长短音大对决","长音要拉长：iː 嘴角咧开、uː 嘴唇撮圆；短音短促放松。每组对比词大声读 5 遍，体会嘴巴的不同。","sheep-ship / food-good / car-cut / least-list / feet-fit"],["开口度大对决","æ 要把嘴张到最大；ə 最轻最懒，永远不重读。对着镜子练：bed 和 bad 嘴型完全不同。","bed-bad / men-man / hot-door / bird-about / pen-pan"],["清浊大对决","把手放在喉咙上：声带振动的是浊辅音。θ/ð 只差声带振动，think 和 this 嘴型一样！","think-this / seat-seed / watch-just / sip-zip / fan-van"],["音标大闯关（总测验）","48 个音标从头快速过一遍，每个读 3 个例词。读不出来的做上标记——这就是你的「专属弱点清单」，明天开始拼读阶段继续磨。","用上面的音标表自测，统计：48 个里你能读对几个？"]];

/* 新概念一册精选 40 课（改编对话版，配 Leo 老师式讲法） */
/* 格式：[模拟课号, 标题, 对话, 生词(|分隔), 语法点, 讲解] */
const NCE=[
[1,"打招呼与确认物主","A: Excuse me!\nB: Yes?\nA: Is this your umbrella?\nB: Yes, it is. Thank you very much!","excuse me 打扰一下|umbrella 雨伞|yes 是的|very much 非常|thank 感谢","Is this your...? 一般疑问句","把陈述句 This is your umbrella 的 is 挪到句首就变疑问句。回答：Yes, it is. / No, it isn't.（用 it 代替物品）"],
[2,"确认物主·否定回答","A: Is this your pen?\nB: No, it isn't.\nA: Is this your pencil?\nB: Yes, it is. Here it is!","pen 钢笔|pencil 铅笔|here 这里|book 书|watch 手表|coat 外套|dress 连衣裙|shirt 衬衫","isn't 否定缩写","is not 缩写成 isn't。否定回答：No, it isn't. 注意英语的回答是「前肯后否要看问句」：Is this...? → Yes, it is. / No, it isn't."],
[5,"认识新朋友","A: Good morning!\nB: Good morning! This is Xiao Wang.\nA: Nice to meet you!\nB: Nice to meet you, too. Are you Chinese?\nA: Yes, I am.","good morning 早上好|nice 令人愉快的|meet 遇见|Chinese 中国的|too 也|student 学生","be动词 am/is/are","我用 am，你/我们/他们用 are，他/她/它用 is。国籍前不用冠词：I am Chinese（不说 a Chinese）。"],
[7,"聊职业","A: Are you a teacher?\nB: No, I'm not. I'm an engineer.\nA: What's your job?\nB: I'm a nurse. And you?","job 工作|teacher 教师|engineer 工程师|nurse 护士|taxi driver 出租车司机|policeman 警察","a 还是 an","辅音音素开头用 a（a teacher），元音音素开头用 an（an engineer, an apple）。注意听发音不是看字母：an hour（h 不发音）。"],
[9,"问好寒暄","A: Hello, Helen!\nB: Hi, Tim! How are you today?\nA: I'm very well, thank you. And you?\nB: I'm fine, thanks. Nice to see you!\nA: Nice to see you, too. Goodbye!","hello 你好|today 今天|well 身体好的|fine 很好的|thanks 谢谢|goodbye 再见","How are you? 及回答","How are you? 是问身体状况不是问「你好」，标准回答：I'm fine / very well, thank you. And you?（礼貌在于反问对方）"],
[11,"这是谁的？","A: Whose shirt is that?\nB: Is it Tim's?\nA: Perhaps it is.\nB: Whose is this one?\nA: It's mine!","whose 谁的|shirt 衬衫|perhaps 也许|blue 蓝色的|white 白色的|father 父亲|sister 姐妹|brother 兄弟|tie 领带","Whose + 名词所有格","人名+'s 表示「谁的」：Tim's = Tim 的。my/mine：my 后接名词，mine 单独用（It's mine = It's my shirt）"],

/* 词法 */
function sqlTokens(s){
  const toks=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue}
    if(c==='-'&&s[i+1]==='-'){while(i<s.length&&s[i]!=='\n')i++;continue}
    if(c==="'"){let j=i+1,v='';while(j<s.length){if(s[j]==="'"){if(s[j+1]==="'"){v+="'";j+=2}else break}else{v+=s[j];j++}}if(s[j]!=="'")throw new Error('引号没有闭合');toks.push({t:'str',v});i=j+1;continue}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;toks.push({t:'num',v:parseFloat(s.slice(i,j))});i=j;continue}
    if(/[A-Za-z_\u4e00-\u9fa5]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_\u4e00-\u9fa5]/.test(s[j]))j++;toks.push({t:'id',v:s.slice(i,j)});i=j;continue}
    const two=s.slice(i,i+2);
    if(two==='>='||two==='<='||two==='<>'||two==='!='){toks.push({t:'op',v:two});i+=2;continue}
    if('=><(),.*+-/%;'.includes(c)){toks.push({t:'op',v:c});i++;continue}
    throw new Error('无法识别的字符：'+c);
  }
  return toks;
}

function Parser(toks){return{toks,pos:0,
  cur(){return this.toks[this.pos]},

  opVal(list){const c=this.cur();if(c&&c.t==='op'&&list.indexOf(c.v)>=0){this.pos++;return c.v}return null},
  op(v){const c=this.cur();if(c&&c.t==='op'&&c.v===v){this.pos++;return true}return false},

function tableRef(P){
  if(P.op('(')){
    const sub=parseSelect(P);
    P.expectOp(')');
    let alias=null;
    if(P.kw('AS'))alias=P.expectId();
    else{const n=P.cur();if(n&&n.t==='id'&&!SQLKW.has(n.v.toUpperCase())){alias=n.v;P.pos++}}

function parseSelect(P){

  const distinct=P.kw('DISTINCT');

/* 求值 */
const AGGS=['COUNT','SUM','AVG','MIN','MAX'];
function containsAgg(e){
  if(!e||typeof e!=='object')return false;
  if(e.t==='fn'&&AGGS.indexOf(e.name)>=0)return true;
  for(const k in e){const v=e[k];if(Array.isArray(v)){if(v.some(containsAgg))return true}else if(v&&typeof v==='object'&&containsAgg(v))return true}

function likeMatch(s,pat){

function evalExpr(e,env,rows){

        case 'SUBSTRING':return a.length>2?String(a[0]).substr(a[1]-1,a[2]):String(a[0]).substr(a[1]-1);
        case 'TRIM':return String(a[0]).trim();
        default:throw new Error('暂不支持的函数：'+n);
      }
    }
    case 'star':throw new Error('* 不能这样单独用');
  }
  throw new Error('无法计算的表达式');
}
function runSelect(q){
  const fromT=DB[q.from.name];
  if(!fromT)throw new Error('没有这张表：'+q.from.name+'（可用表：'+Object.keys(DB).join(', ')+'）');
  const fa=q.from.alias||q.from.name;
  const srcCols=[{alias:fa,cols:fromT.cols}];
  let envs=[];
  fromT.rows.forEach(r=>{const e={};fromT.cols.forEach((c,j)=>{e[c]=r[j];e[fa+'.'+c]=r[j]});envs.push(e)});
  q.joins.forEach(j=>{
    const t=DB[j.t.name];
    if(!t)throw new Error('没有这张表：'+j.t.name);
    const ja=j.t.alias||j.t.name;
    srcCols.push({alias:ja,cols:t.cols});
    const out=[];
    envs.forEach(e=>{
      let matched=false;
      t.rows.forEach(r=>{
        const e2=Object.assign({},e);
        t.cols.forEach((c,ci)=>{e2[c]=r[ci];e2[ja+'.'+c]=r[ci]});
        if(evalExpr(j.cond,e2,null)){matched=true;out.push(e2)}
      });
      if(j.left&&!matched){
        const e2=Object.assign({},e);
        t.cols.forEach(c=>{e2[c]=null;e2[ja+'.'+c]=null});
        out.push(e2);
      }
    });
    envs=out;
  });
  if(q.where)envs=envs.filter(e=>!!evalExpr(q.where,e,null));
  // 展开输出列
  let items=[];
  q.items.forEach(it=>{
    if(it.star)srcCols.forEach(s=>s.cols.forEach(c=>items.push({e:{t:'col',name:c},alias:c})));
    else if(it.starTable){const s=srcCols.find(x=>x.alias===it.starTable);if(!s)throw new Error('不认识的表别名：'+it.starTable);s.cols.forEach(c=>items.push({e:{t:'col',table:s.alias,name:c},alias:c}))}
    else items.push(it);
  });
  const hasAgg=items.some(it=>containsAgg(it.e))||containsAgg(q.having)||(q.order&&q.order.some(o=>containsAgg(o.e)));
  const needGroup=q.group||hasAgg;
  let ctxs;
  if(needGroup){
    const groups=new Map();
    if(q.group){
      envs.forEach(e=>{
        const key=JSON.stringify(q.group.map(g=>evalExpr(g,e,null)));
        if(!groups.has(key))groups.set(key,{env:e,rows:[]});
        groups.get(key).rows.push(e);
      });
    }else groups.set('',{env:envs[0]||{},rows:envs});
    let gs=[...groups.values()];
    if(q.having)gs=gs.filter(g=>!!evalExpr(q.having,g.env,g.rows));
    ctxs=gs;
  }else ctxs=envs.map(e=>({env:e,rows:null}));
  const heads=items.map(it=>it.alias||(it.e.t==='col'?it.e.name:(it.e.t==='fn'?it.e.name+'()':'expr')));
  let out=ctxs.map(ctx=>{
    const aliasEnv={};
    items.forEach(it=>{if(it.alias)aliasEnv[it.alias]=null});
    const rowEnv=Object.assign({},ctx.env);
    const vals=items.map(it=>{
      const v=evalExpr(it.e,ctx.env,ctx.rows);
      if(it.alias)aliasEnv[it.alias]=v;
      return v;
    });
    return{vals,env:aliasEnv,srcEnv:ctx.env,rows:ctx.rows};
  });
  if(q.order&&q.order.length){
    out.sort((a,b)=>{
      for(const o of q.order){
        let va,vb;
        try{va=evalExpr(o.e,mergeEnv(a),a.rows)}catch(x){va=null}
        try{vb=evalExpr(o.e,mergeEnv(b),b.rows)}catch(x){vb=null}
        if(va===null&&vb===null)continue;
        if(va===null)return 1;
        if(vb===null)return -1;
        let r;
        if(typeof va==='string'||typeof vb==='string')r=String(va)<String(vb)?-1:String(va)>String(vb)?1:0;
        else r=va<vb?-1:va>vb?1:0;
        if(r)return o.dir==='DESC'?-r:r;
      }
      return 0;
    });
  }
  if(q.distinct){
    const seen=new Set();
    out=out.filter(x=>{const k=JSON.stringify(x.vals);if(seen.has(k))return false;seen.add(k);return true});
  }
  if(q.limit){
    const ln=evalExpr(q.limit,{},null);
    out=out.slice(0,ln);
  }
  return{rows:out.map(x=>x.vals),heads};
}
function mergeEnv(x){return Object.assign({},x.srcEnv,x.env)}
function runInsert(P){
  P.expectKW('INSERT');P.expectKW('INTO');
  const tn=P.expectId();
  let cols=null;
  if(P.op('(')){cols=[];for(;;){cols.push(P.expectId());if(P.op(','))continue;P.expectOp(')');break}}
  P.expectKW('VALUES');
  const rowsVals=[];
  for(;;){
    P.expectOp('(');
    const vals=[];
    for(;;){
      const c=P.cur();
      if(!c)throw new Error('VALUES 里缺值');
      if(c.t==='num'){vals.push(c.v);P.pos++}
      else if(c.t==='str'){vals.push(c.v);P.pos++}
      else if(c.t==='id'&&c.v.toUpperCase()==='NULL'){vals.push(null);P.pos++}
      else if(c.t==='op'&&c.v==='-'){P.pos++;const n=P.cur();if(!n||n.t!=='num')throw new Error('负号后面要是数字');vals.push(-n.v);P.pos++}
      else throw new Error('VALUES 里只能是数字、字符串或 NULL');
      if(P.op(','))continue;
      P.expectOp(')');break;
    }
    rowsVals.push(vals);
    if(P.op(','))continue;
    break;
  }
  const t=DB[tn];
  if(!t)throw new Error('没有这张表：'+tn+'，可以先 CREATE TABLE');
  const targetCols=cols||t.cols;
  rowsVals.forEach(v=>{
    if(v.length!==targetCols.length)throw new Error('列数('+targetCols.length+')和值数('+v.length+')不一致');
    const r=t.cols.map(c=>{const i=targetCols.indexOf(c);return i>=0?v[i]:null});
    t.rows.push(r);
  });
  return{msg:'成功向 '+tn+' 插入 '+rowsVals.length+' 行数据'};
}
function runUpdate(P){
  P.expectKW('UPDATE');
  const tn=P.expectId();
  P.expectKW('SET');
  const sets=[];
  for(;;){const col=P.expectId();P.expectOp('=');sets.push({col,e:expr(P)});if(P.op(','))continue;break}
  let where=null;
  if(P.kw('WHERE'))where=expr(P);
  const t=DB[tn];
  if(!t)throw new Error('没有这张表：'+tn);
  let cnt=0;
  t.rows=t.rows.map(r=>{
    const env={};t.cols.forEach((c,j)=>env[c]=r[j]);
    if(!where||evalExpr(where,env,null)){
      cnt++;
      return r.map((v,j)=>{const s=sets.find(x=>x.col===t.cols[j]);return s?evalExpr(s.e,env,null):v});
    }
    return r;
  });
  return{msg:where?'更新了 '+cnt+' 行':'更新了 '+cnt+' 行（没有 WHERE，全表都被改了！）'};
}
function runDelete(P){
  P.expectKW('DELETE');P.expectKW('FROM');
  const tn=P.expectId();
  let where=null;
  if(P.kw('WHERE'))where=expr(P);
  const t=DB[tn];
  if(!t)throw new Error('没有这张表：'+tn);
  const before=t.rows.length;
  if(!where){t.rows=[];return{msg:'删掉了全部 '+before+' 行（没有 WHERE 是全表删除！）'}}
  t.rows=t.rows.filter(r=>{const env={};t.cols.forEach((c,j)=>env[c]=r[j]);return !evalExpr(where,env,null)});
  return{msg:'删除了 '+(before-t.rows.length)+' 行'};
}
function runCreate(P){
  P.expectKW('CREATE');P.expectKW('TABLE');
  const name=P.expectId();
  P.expectOp('(');
  const cols=[];
  for(;;){
    const cn=P.expectId();
    cols.push(cn);
    while(P.cur()&&P.cur().t==='id')P.pos++; /* 类型 */
    if(P.cur()&&P.cur().t==='op'&&P.cur().v==='('){P.pos++;while(P.cur()&&!P.op(')'));P.expectOp(')')}
    while(P.cur()&&P.cur().t==='id')P.pos++; /* PRIMARY KEY 等 */
    if(P.op(','))continue;
    P.expectOp(')');break;
  }
  DB[name]={desc:'你自己建的表',cols,rows:[]};
  return{msg:'表 '+name+' 建好了！列：'+cols.join(', ')+'。现在用 INSERT 插几行试试'};
}
function runSQL(sql){
  dbEnsure();
  const P=Parser(sqlTokens(sql));
  let last=null;const msgs=[];
  for(;;){
    while(P.op(';'));
    if(!P.cur())break;
    const c=P.cur();
    if(c.t!=='id')throw new Error('每句话要以 SELECT / INSERT / UPDATE / DELETE / CREATE 开头');
    const u=c.v.toUpperCase();
    let res=null;
    if(u==='SELECT')res=runSelect(parseSelect(P));
    else if(u==='INSERT')res=runInsert(P);
    else if(u==='UPDATE')res=runUpdate(P);
    else if(u==='DELETE')res=runDelete(P);
    else if(u==='CREATE')res=runCreate(P);
    else throw new Error('暂不支持：'+u+'（目前支持 SELECT / INSERT / UPDATE / DELETE / CREATE TABLE）');
    if(res&&res.rows)last=res;
    if(res&&res.msg)msgs.push(res.msg);
    if(!P.cur())break;
    P.expectOp(';');
  }
  return{last,msgs};
}

function sameRows(a,b){
  if(!a||!b)return false;
  if(a.rows.length!==b.rows.length)return false;
  for(let i=0;i<a.rows.length;i++){
    const ra=a.rows[i],rb=b.rows[i];
    if(ra.length!==rb.length)return false;
    for(let j=0;j<ra.length;j++){
      let va=ra[j],vb=rb[j];
      if(typeof va==='number'&&typeof vb==='number'){if(Math.abs(va-vb)>1e-9)return false}
      else if(String(va)!==String(vb))return false;
    }
  }
  return true;
}

/* ---- SQL 老师点评：错误诊断 + 知识点讲解 + 任务差距提示 ---- */
function sqlConcept(sql){
  const s=sql.toUpperCase();const c=[];
  if(/\bJOIN\b/.test(s))c.push('多表连接 JOIN');
  if(/\bGROUP BY\b/.test(s))c.push('分组 GROUP BY');
  if(/\bHAVING\b/.test(s))c.push('分组后筛选 HAVING');
  if(/\bORDER BY\b/.test(s))c.push('排序 ORDER BY');
  if(/\bLIMIT\b/.test(s))c.push('限量 LIMIT');
  if(/\bLIKE\b/.test(s))c.push('模糊匹配 LIKE');
  if(/\bBETWEEN\b/.test(s))c.push('范围筛选 BETWEEN');
  if(/\bDISTINCT\b/.test(s))c.push('去重 DISTINCT');
  if(/\bCONCAT\b|\bSUBSTRING\b|\bUPPER\b|\bLOWER\b|\bREPLACE\b|\bTRIM\b/.test(s))c.push('字符串函数');
  if(/\bROUND\b/.test(s))c.push('取整 ROUND');
  if(/\bCOUNT\b/.test(s))c.push('计数 COUNT');
  if(/\bSUM\b/.test(s))c.push('求和 SUM');
  if(/\bAVG\b/.test(s))c.push('平均 AVG');
  if(/\bMAX\b/.test(s)||/\bMIN\b/.test(s))c.push('最值 MAX/MIN');
  if(/\bINSERT\b/.test(s))c.push('插入 INSERT');
  if(/\bUPDATE\b/.test(s))c.push('更新 UPDATE');
  if(/\bDELETE\b/.test(s))c.push('删除 DELETE');
  if(/\bCREATE\b/.test(s))c.push('建表 CREATE');
  if(/\bSELECT\b/.test(s)&&!c.length)c.push('基础查询 SELECT/WHERE');
  return c;
}
function sqlErrCoach(sql,msg){
  const tips=[];
  if(/[，；：（）“”‘’【】]/.test(sql))tips.push('检测到<b>中文标点</b>——SQL 只认英文标点（, ; ( ) \'），请切到英文输入法逐个检查');
  if(/==/.test(sql))tips.push('SQL 判断相等只用<b>一个 =</b>，两个 == 是别的编程语言的写法');
  if(/引号没有闭合/.test(msg))tips.push('字符串开头和结尾都要有单引号 \'，检查是不是只写了一半，或中间多了个引号');
  if(/没有这张表/.test(msg))tips.push('表名不对。点上方「🗃 数据表」里的彩色标签，先看看库里到底有哪几张表、名字怎么拼');
  if(/不认识的列/.test(msg))tips.push('列名不对。先运行 <b>SELECT * FROM 表名</b> 看这张表有哪些列，列名以查出来的为准（注意大小写和拼写）');
  if(/不认识的表别名/.test(msg))tips.push('用了别名就要全程用别名：FROM bills b 之后写 bills.amount 会报错，要写 b.amount');
  if(/要和 GROUP BY 一起用/.test(msg))tips.push('聚合函数（COUNT/SUM/AVG/MAX/MIN）把很多行压成一行。想同时看到普通列，就用 GROUP BY 告诉数据库按什么分组');
  if(/列数\(/.test(msg))tips.push('INSERT 的列清单和 VALUES 的值要一一对应，数一数两边的个数是不是一样');
  if(/每句话要以/.test(msg))tips.push('每条语句必须以 SELECT / INSERT / UPDATE / DELETE / CREATE 开头，检查第一个词是不是拼错了');
  if(/缺少关键字/.test(msg))tips.push('语句结构不完整。SELECT 的骨架是：<b>SELECT 列 FROM 表 WHERE 条件</b>，对照检查缺了哪一段');
  if(/暂不支持/.test(msg))tips.push('这条语法超出迷你引擎的范围（如窗口函数），但思路是对的——记住它，到 SQLBolt 或真实 MySQL 里验证');
  if(/无法识别的字符/.test(msg))tips.push('引擎遇到了不认识的字符，多半是中文标点或特殊符号混进来了');
  if(!tips.length)tips.push('常见原因：① 关键字拼写（SELECT/FROM/WHERE）② 漏了逗号、括号 ③ 字符串没加单引号。对照错误信息提示的位置逐字检查');
  return '<div style="font-weight:700;margin-bottom:6px">🔎 错误诊断</div>'+tips.map(t2=>'• '+t2).join('<br>')+'<div style="margin-top:8px" class="muted">💪 报错不丢人，每个写 SQL 的人都是改错改出来的。改完再运行一次！</div>';
}

function coachVsTasks(res){
  // 在干净库上对比未完成的任务，按"逐格相似度"找出最接近的那道，给出针对性提示
  if(!res||!res.heads)return null;

      if(ref.heads.length!==res.heads.length)continue;

      for(let r=0;r<Math.min(ref.rows.length,res.rows.length);r++){
        for(let c=0;c<ref.heads.length;c++){
          if(String(ref.rows[r][c])===String(res.rows[r]?res.rows[r][c]:undefined))same++;
        }
      }
      const ratio=total?same/total:1;
      if(!best||ratio>best.ratio)best={i,ref,ratio};
    }
  }finally{DB=saved}
  if(!best||best.ratio<0.25)return null;
  const i=best.i,ref=best.ref;
  if(ref.rows.length===res.rows.length){
    let diffCol=-1;
    outer:for(let j=0;j<ref.heads.length;j++){for(let r=0;r<ref.rows.length;r++){const a=ref.rows[r][j],b=res.rows[r]?res.rows[r][j]:undefined;if(String(a)!==String(b)){diffCol=j;break outer}}}

}

function gradeOutput(o){
  const fields=[o.gain,o.diff,o.improve,o.selfTalk].concat(Object.values(o.mods||{}));
  const filled=fields.filter(x=>(x||'').trim().length>=5).length;
  const total=Math.max(fields.length,1);
  let comp=Math.round(filled/total*40);
  const all=(fields.join(' ')+(o.enOut||''));
  let spec=0;
  if(all.length>=120)spec+=8;else if(all.length>=60)spec+=4;
  if(/\d/.test(all))spec+=4;
  if(/[a-zA-Z]{2,}/.test(all))spec+=4;
  if(/《|SQL|SELECT|音标|单词|句型/.test(all))spec+=4;
  spec=Math.min(spec,20);
  let ref=0;
  if(/困难|卡|慢|错|忘|为什么|发现|原来|问题|不熟/.test(all))ref+=10;
  if((o.diff||'').trim().length>=20)ref+=10;
  ref=Math.min(ref,20);
  let act=0;
  if(/明天|接下来|改进|调整|计划|试试|目标|开始|坚持/.test(all))act+=10;
  if((o.improve||'').trim().length>=15)act+=10;
  act=Math.min(act,20);
  let score=comp+spec+ref+act;
  // 英语输出加分与检查
  let enChecks=null;
  if((o.enOut||'').trim()){
    const t=o.enOut.trim();const issues=[];
    if(t.length<10)issues.push('写得太短啦，至少写 2 句（10 个词以上）');
    if(!/[.?!]/.test(t))issues.push('句子结尾要有标点（. ! ?）');
    if(/^[a-z]/.test(t))issues.push('句子开头字母要大写');
    if(/[\u4e00-\u9fa5]/.test(t))issues.push('用英文写哦，中文单词混进来啦');
    if(/\b(i)\b/.test(t))issues.push('“我” I 要永远大写');
    if(!/[\u4e00-\u9fa5]/.test(t)&&t.split(/\s+/).length>=8&&!issues.length)score+=5;
    enChecks={issues,ok:!issues.length};
    score=Math.min(score,100);
  }
  const grade=score>=85?'A':(score>=70?'B':'C');
  const dims={完成度:comp+'/40',具体性:spec+'/20',反思深度:ref+'/20',行动力:act+'/20'};
  const weakest=Object.entries({完成度:comp/40,具体性:spec/20,反思深度:ref/20,行动力:act/20}).sort((a,b)=>a[1]-b[1])[0][0];
  const suggMap={
    '完成度':'每个格子都认真填满——空着的部分，就是明天会忘掉的部分。',
    '具体性':'试着写得更具体：哪个单词？哪条 SQL？卡在第几步？数字和例子是最好的记忆锚点。',
    '反思深度':'多问自己一句“为什么会这样”，把困难写清楚，它就解决了一半。',
    '行动力':'给明天定一个“小到不可能失败”的具体动作，比如“明早只背 5 个单词”。'
  };
  const cmtA=['非常出色！你的复盘已经具备了“具体经历+真实困难+明确行动”的完整结构，这就是《认知天性》里说的“生成式学习”。保持这个节奏！','高质量的一次输出！能看出你是真的在思考而不是应付。把这种诚实面对自己的态度坚持下去，量变很快会引起质变。'];
  const cmtB=['不错，已经形成了复盘的基本框架。再具体一点点、再深入一点点，你的复盘就会从“记录”升级为“成长引擎”。','挺好的！完成度不错。记住：复盘里多写一个“为什么”，明天的你就少走一次弯路。'];
  const cmtC=['先完成，再完美——你已经迈出了最重要的一步，坚持写本身就值得表扬。但内容还偏笼统，试着明天多写两行“具体发生了什么”。','能交作业就是胜利！不过老师希望看到更多细节。写不出细节=没真正消化，明天学着慢一点、细一点。'];
  const pool=grade==='A'?cmtA:(grade==='B'?cmtB:cmtC);
  const cmt=pool[Math.floor(Math.random()*pool.length)];
  return{score,grade,dims,cmt,sugg:suggMap[weakest],weakest,enChecks};
}

/* ---- 进度看板 ---- */
function bdDone(mod){let c=0;for(const k in S.done){if(S.done[k]&&k.indexOf(mod+'|')===0)c++}return c}
function bdDayCnt(ds){let c=0;for(const k in S.done){if(S.done[k]&&k.endsWith('|'+ds))c++}return c}
function bdWeekMon(ds){const w=pd(ds).getDay();return addD(ds,w===0?-6:1-w)}
function wkStat(m0){let a=0,f=0,pass=0;for(let i=0;i<7;i++){const ds=addD(m0,i);if(daysBetween(ds,todayStr())>0)break;pass++;if(bdDayCnt(ds)>0)a++;if(S.outputs[ds])f++}return[a,f,pass]}
function renderBoard(){

  const st=streak();

    [['计划第',n+' 天'],['🔥 连续复盘',st+' 天'],['今日打卡',todayHit+' / '+mods.length],['累计打卡',totalDone+' 次']].map(x=>'<div style="text-align:center;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px 2px"><div class="small muted">'+x[0]+'</div><div style="font-weight:800;font-size:15.5px;margin-top:2px">'+x[1]+'</div></div>').join('')+'</div></div>';

  const rb2=S.shelf.filter(b=>b.status===1);
  if(rb2.length)h+='<div style="margin-top:10px;padding:8px 10px;background:#fefce8;border:1px dashed #facc15;border-radius:10px">'+rb2.slice(0,3).map(b=>'<div style="margin:4px 0"><div class="small" style="display:flex;justify-content:space-between;gap:6px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📖 《'+esc(b.title)+'》</span><b class="muted" style="white-space:nowrap">'+(b.progress||0)+'%</b></div>'+bar((b.progress||0)/100)+'</div>').join('')+(rb2.length>3?'<div class="small muted">…还有 '+(rb2.length-3)+' 本在读</div>':'')+'</div>';
  S.custom.forEach(m=>{const dn=bdDone('c'+m.id);const goal=m.goalDays||30;const lv=LEVELS[m.level||0]||LEVELS[0];h+=row(m.emoji||'⭐',esc(m.name),lv.emoji+' '+lv.name,Math.min(dn,goal),goal,dn>=goal?'目标达成 ✓':Math.round(dn/goal*100)+'%')});

  // 坚持热力图（近13周）

      line+='<div title="'+ds+(future?'':' · 打卡 '+c+' 项')+'" style="width:12px;height:12px;border-radius:3px;background:'+(future?'transparent':HEAT[Math.min(c,4)])+';flex:none"></div>';

    ['🗄','SQL 理论 14 天',sqN>=14],['🗄','SQL 56 天通关',sqN>=56],['🧪','SQL 实践 5 题',sqlT>=5],['🧪','SQL 实践 20 题全通',sqlT>=20],
    ['📖','摘抄 10 条',(S.quotes||[]).length>=10],['📖','读完第 1 本书',readDoneB>=1],['📖','读完 5 本书',readDoneB>=5],
    ['✍','复盘 21 篇',fbN>=21],['⭐','累计打卡 100 次',totalDone>=100],['🏆','累计打卡 365 次',totalDone>=365]

function genMap(title){
  return [(title||'这本书')+" · 阅读分析框架",
   ["① 主题与定位",["一句话主题","合上书，用一句话说清整本书在讲什么"],["解决什么问题","作者写给谁看？想解决读者的什么痛点？"],["书的类型","理论型（讲道理）/ 实用型（教做法）/ 叙事型（讲故事）"]],
   ["② 结构与脉络",["目录骨架","每个大章节用一句话概括，串成全书的骨架"],["关键概念","书里反复出现的 3~5 个关键词"],["论证方式","作者靠案例、数据还是故事来说服你？"]],
   ["③ 核心观点",["最重要的观点","作者最想让你记住的是什么"],["支撑理由","这个观点靠什么成立？"],["我的态度","同意 / 部分同意 / 反对，为什么"]],
   ["④ 打动我的地方",["金句摘录","抄下来，并写下为什么打动你"],["共鸣与联想","它让你想起了自己的哪段经历？"]],
   ["⑤ 行动清单",["24小时行动","读完立刻能做的一件小事"],["30天习惯","把书中哪个方法变成日常习惯？"],["讲给别人","向朋友复述这本书，讲不清的地方就是没读懂的地方"]]
  ];
}
function refMap(title){return BOOKMAPS[title]||genMap(title)}
function mapCompare(title){
  const m=refMap(title);
  if(!m)return null;
  const ai=[];
  const walk=(n,depth)=>{if(typeof n==='string'){if(n.trim())ai.push({text:n,depth})}else{if(n[0]&&n[0].trim())ai.push({text:n[0],depth});for(let i=1;i<n.length;i++)walk(n[i],depth+1)}};
  for(let i=1;i<m.length;i++)walk(m[i],0);
  const myAll=S.mymaps[title]||[];
  const my=myAll.map(n=>(n.text||'').trim()).filter(Boolean);
  const shared=(a,b)=>{
    if(/[\u4e00-\u9fa5]/.test(a)&&/[\u4e00-\u9fa5]/.test(b)){
      for(let i=0;i<a.length-1;i++){if(b.indexOf(a.substr(i,2))>=0)return true}
      return false;
    }
    const wa=(a.toLowerCase().match(/[a-z]+/g))||[],wb=(b.toLowerCase().match(/[a-z]+/g))||[];
    return wa.some(w=>w.length>=3&&wb.indexOf(w)>=0);
  };
  const covered=ai.filter(p=>my.some(t=>shared(t,p.text)));
  const missed=ai.filter(p=>!my.some(t=>shared(t,p.text)));
  const extra=my.filter(t=>!ai.some(p=>shared(t,p.text)));
  return{total:ai.length,covered,missed,extra,myCount:my.length};
}

function runSQLUI(){
  dbEnsure();
  let doneNew=[];
  try{
    const r=runSQL(App.sqlText);
    App.sqlRes={ok:true,last:r.last,msgs:r.msgs};
    if(r.last)doneNew=checkTasks(r.last)||[];
  }catch(e){App.sqlRes={ok:false,err:e.message}}
  let coach='';
  if(!App.sqlRes.ok)coach=sqlErrCoach(App.sqlText,App.sqlRes.err);
  else{
    coach=sqlOkCoach(App.sqlText,App.sqlRes);
    if(doneNew.length)coach+='<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #d5dbee">🎉 <b>实践任务 第'+doneNew.join('、')+'题 完成通过！</b><br>'+doneNew.map(i2=>'任务'+i2+' 考察：'+sqlConcept(SQLTASKS[i2-1][1]).join('、')+'。').join('<br>')+'</div>';
    else if(App.sqlRes.last&&App.sqlRes.last.rows&&App.sqlRes.last.heads){
      const hint=coachVsTasks(App.sqlRes.last);
      if(hint)coach+='<div style="margin-top:8px;padding-top:8px;border-top:1px dashed #d5dbee">🎯 '+hint+'</div>';
    }
  }
  App.sqlCoach=coach;
  render();
}

function expData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});

function impData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.startDate)throw 0;S=d;save();render();toast('导入成功 ✅')}catch(e){toast('文件格式不对')}};
  r.readAsText(f);
}
/* ---- 跨设备同步码：Unicode 安全的 base64 快照，复制→粘贴→导入 ---- */
let syncArm=false;
function syncCodeOf(){return btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
async function copySync(){
  const code=syncCodeOf();
  let done=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(code);done=true}}catch(e){}
  if(!done){
    try{
      const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();done=document.execCommand('copy');document.body.removeChild(ta);
    }catch(e){}
  }
  if(done)toast('同步码已复制（'+(code.length/1024).toFixed(1)+'KB）→ 发给另一台，在那边「粘贴同步码」导入');
  else{App.syncDraft=code;render();toast('浏览器不让自动复制，已放进下面文本框，请手动全选复制')}
}
function applySyncCode(){
  const code=(App.syncDraft||'').trim();
  if(!code)return toast('先把另一台的同步码粘贴到框里');
  if(!syncArm){syncArm=true;render();toast('⚠️ 再点一次「确认导入」：同步码数据会覆盖本机当前数据');return}
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(code))));
    if(!d||!d.startDate)throw 0;
    S=d;S.lastSyncedAt=todayStr();save();syncArm=false;App.syncDraft='';render();
    toast('同步完成 ✅ 本机已更新为对方的数据');
  }catch(e){syncArm=false;render();toast('同步码格式不对：可能没复制完整（要复制完整一整串）')}
}

/* ---- GitHub Gist 自动云同步：令牌存独立 localStorage，绝不进入 S（同步码/备份里都没有它） ---- */
const TOK_KEY='lxzt_tok',GIST_KEY='lxzt_gist',LSYNC_KEY='lxzt_lsync';
let gistTimer=null,gistApplying=false,bootPulling=false;
function gistTok(){return localStorage.getItem(TOK_KEY)||''}
function gistId(){return localStorage.getItem(GIST_KEY)||''}
function gistOn(){return !!(gistTok()&&gistId())}
function saveGistCfg(tok,gist){if(tok)localStorage.setItem(TOK_KEY,tok);else localStorage.removeItem(TOK_KEY);if(gist)localStorage.setItem(GIST_KEY,gist);else localStorage.removeItem(GIST_KEY)}
async function gistApi(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method,headers:{'Authorization':'token '+gistTok(),'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){let m='HTTP '+r.status;try{const j=await r.json();if(j.message)m=j.message}catch(e){}throw new Error(m)}
  return r.json();
}
async function gistSetup(){
  const tok=(($('#gtok')&&$('#gtok').value)||'').trim();
  if(!tok)return toast('先粘贴 GitHub 令牌');
  saveGistCfg(tok,'');
  try{
    S.syncStamp=Date.now();localStorage.setItem(KEY,JSON.stringify(S));
    const g=await gistApi('POST','/gists',{description:'学习工作台数据同步（私有）',public:false,files:{'lxzt.json':{content:JSON.stringify(S)}}});
    saveGistCfg(tok,g.id);localStorage.setItem(LSYNC_KEY,String(Date.now()));
    toast('自动同步已开启 ✅');render();
  }catch(e){saveGistCfg('','');toast('开启失败：'+e.message)}
}
async function gistPush(silent){
  if(!gistOn()||gistApplying)return;
  if(silent&&bootPulling)return; // 首次拉取完成前禁止自动上传，防止旧数据覆盖云端
  S.syncStamp=Date.now();localStorage.setItem(KEY,JSON.stringify(S));
  try{
    await gistApi('PATCH','/gists/'+gistId(),{files:{'lxzt.json':{content:JSON.stringify(S)}}});
    localStorage.setItem(LSYNC_KEY,String(Date.now()));
    if(!silent)toast('已上传到云端 ☁️');
  }catch(e){if(!silent)toast('上传失败：'+e.message)}
}
async function gistPull(auto){
  if(!gistOn()||gistApplying)return false;
  try{
    const g=await gistApi('GET','/gists/'+gistId());
    const txt=g&&g.files&&g.files['lxzt.json']&&g.files['lxzt.json'].content;
    if(!txt){if(!auto)toast('云端还没有数据');return true}
    const d=JSON.parse(txt);
    if(!d||!d.startDate)throw new Error('云端数据损坏');
    if(d.syncStamp&&S.syncStamp&&d.syncStamp<=S.syncStamp){if(!auto)toast('本机已是最新 ✅');return true}
    gistApplying=true;
    S=d;localStorage.setItem(KEY,JSON.stringify(S));
    localStorage.setItem(LSYNC_KEY,String(Date.now()));
    render();
    gistApplying=false;
    toast(auto?'已自动同步云端最新数据 ✅':'已拉取云端数据 ✅');
    return true;
  }catch(e){gistApplying=false;if(!auto)toast('拉取失败：'+e.message);return false}
}
function schedulePush(now){if(!gistOn())return;clearTimeout(gistTimer);gistTimer=setTimeout(()=>gistPush(true),now?800:4000)}
function gistOff(){saveGistCfg('','');toast('已关闭自动同步（云端数据保留）');render()}

/* ---- 渲染入口 ---- */
function render(){
  const v=App.view;
  $('#view').innerHTML=v==='today'?renderToday():v==='board'?renderBoard():v==='books'?renderBooks():v==='bmap'?renderBmap():v==='en'?renderEn():v==='sql'?renderSql():v==='custom'?renderCustom():v==='review'?renderReview():v==='den'?renderDen():renderSettings();
  navRender();
  const t=todayStr();
  $('#hsub').textContent=cnDate(t)+' · 计划第 '+Math.max(dayNumOf(t),1)+' 天';
  $('#hstreak').textContent='🔥 '+streak()+' 天';
  window.scrollTo(0,0);
}
load();
render();
if(gistOn()){
  // 先拉云端最新（期间禁止自动上传，防止本机旧数据覆盖云端新数据）
  bootPulling=true;
  gistPull(true).then(ok=>{
    if(!ok){ // 首次拉取失败（如断网）：10秒后重试一次，期间保持禁止自动上传
      return new Promise(r=>setTimeout(r,10000)).then(()=>gistPull(true));
    }
    return ok;
  }).finally(()=>{
    bootPulling=false;
    if(S.lastVisit!==todayStr()){S.lastVisit=todayStr();save()}
  });
}else{
  if(S.lastVisit!==todayStr()){S.lastVisit=todayStr();save()}
}
// 周期性后台拉取：每30秒静默检查云端是否有更新（页面可见时才拉）
setInterval(()=>{if(gistOn()&&!bootPulling&&!document.hidden)gistPull(true)},30000);
// 从后台切回前台时也立即拉一次（电脑端刚推的数据，手机切回来就能看到）
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gistOn()&&!bootPulling)gistPull(true)});
</script>
