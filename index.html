<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanna · 在线应用集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #eef4fb 0%, #f7fafd 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 26px; color: #1f2d3d; text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: #7a8a99; font-size: 14px; margin-bottom: 28px; }
  .card {
    display: block; text-decoration: none; background: #fff; border-radius: 16px;
    padding: 22px 24px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(31,45,61,.08);
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(31,45,61,.14); }
  .card .emoji { font-size: 34px; }
  .card .name { font-size: 18px; font-weight: 700; color: #1f2d3d; margin: 8px 0 4px; }
  .card .desc { font-size: 13px; color: #7a8a99; line-height: 1.6; }
  .card .go { color: #3498db; font-size: 13px; font-weight: 600; margin-top: 8px; }
  footer { text-align: center; color: #a0adb9; font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 Hanna · 在线应用集</h1>
  <div class="sub">选择应用进入 · 均为纯前端 PWA，数据保存在本机浏览器</div>

  <a class="card" href="./water-todo/">
    <div class="emoji">💧</div>
    <div class="name">喝水助手 · 待办提醒</div>
    <div class="desc">定点喝水提醒 · 五种待办类型（含工作日/自定义）· 密码日记</div>
    <div class="go">进入 →</div>
  </a>

  <a class="card" href="./学习工作台/">
    <div class="emoji">📚</div>
    <div class="name">学习工作台</div>
    <div class="desc">读书 / 英语 / SQL / 自定义模块 / 看板 / 复盘</div>
    <div class="go">进入 →</div>
  </a>

  <footer>Hanna · GitHub Pages 托管</footer>
</div>
</body>
</html>
